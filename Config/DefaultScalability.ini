; Campus Ops scalability: entries here replace the engine defaults (BaseScalability.ini) key by key.
; The in-game video options (CampusGraphics.cpp) pick the levels and set the cvars that are not per level.

; ------------------------------------------------------------------ shadows
; Low keeps the sun's shadows (engine low turns shadowing off entirely): coarser virtual shadow pages, hard edges.
[ShadowQuality@0]
r.ShadowQuality=2
r.Shadow.CSM.MaxCascades=2
r.Shadow.MaxResolution=1024
r.Shadow.MaxCSMResolution=1024
r.Shadow.DistanceScale=0.6
r.Shadow.RadiusThreshold=0.05
r.Shadow.Virtual.MaxPhysicalPages=1024
r.Shadow.Virtual.ResolutionLodBiasDirectional=1.0
r.Shadow.Virtual.ResolutionLodBiasDirectionalMoving=1.5
r.Shadow.Virtual.SMRT.RayCountDirectional=0
r.Shadow.Virtual.SMRT.RayCountLocal=0
r.ContactShadows=0

[ShadowQuality@1]
r.Shadow.Virtual.ResolutionLodBiasDirectional=0.5
r.Shadow.Virtual.ResolutionLodBiasDirectionalMoving=1.0
r.Shadow.Virtual.MaxPhysicalPages=1536

; ------------------------------------------------------------------ global illumination
; Level 1 (in-game "low") is Lumen's irradiance field; the campus overflows the 2048 surface cache at full card density.
[GlobalIlluminationQuality@2]
r.LumenScene.SurfaceCache.AtlasSize=4096

[GlobalIlluminationQuality@3]
r.LumenScene.SurfaceCache.AtlasSize=4096

; ------------------------------------------------------------------ textures
; Anisotropic filtering is cheap and keeps the paving and floor tiles sharp at grazing angles.
[TextureQuality@0]
r.Streaming.MipBias=1
r.MaxAnisotropy=4
r.Streaming.PoolSize=500

[TextureQuality@1]
r.Streaming.MipBias=0
r.MaxAnisotropy=8
r.Streaming.PoolSize=900

[TextureQuality@2]
r.MaxAnisotropy=16
r.Streaming.PoolSize=1500

[TextureQuality@3]
r.MaxAnisotropy=16
r.Streaming.PoolSize=2500
r.Streaming.LimitPoolSizeToVRAM=1
